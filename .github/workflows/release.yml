name: Release

# Releases are built only from v* tags. A repository ruleset restricts creating,
# moving and deleting v* tags to repository admins.
on:
  push:
    tags:
      - v*

# Each job declares the minimum permissions it needs.
permissions: {}

jobs:
  # The image and the CLI are built while CI and E2E finish on the tagged commit. Each job waits for those
  # checks before it publishes anything (image push, attestations).
  verify_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate tag and version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: invalid tag '$TAG' (expected vMAJOR.MINOR.PATCH[-PRERELEASE])" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(jq -r '.version' web/package.json)"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: tag $TAG does not match web/package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "short_sha=${COMMIT:0:7}"
          } >> "$GITHUB_OUTPUT"

  docker_build:
    runs-on: ubuntu-latest
    needs: verify_tag
    permissions:
      contents: read
      checks: read # wait-for-checks.js reads check runs for the tagged commit
      id-token: write # sign the build provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: docker.io/docspringcom/rack-gateway
      VERSION: ${{ needs.verify_tag.outputs.version }}
      SHORT_SHA: ${{ needs.verify_tag.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # No build cache: release images are built from scratch so a cache written by
      # another workflow run can't influence what gets published.
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          no-cache: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: Wait for CI and E2E checks on the tagged commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const script = require('./.github/wait-for-checks.js');
            await script({ github, context, core });

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # The same build again, served from this job's builder, which only holds the from-scratch build above.
      - name: Push Docker image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          # Prerelease versions (vX.Y.Z-rc.1) don't move :latest.
          tags: |
            ${{ env.IMAGE }}:v${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
            ${{ !contains(env.VERSION, '-') && format('{0}:latest', env.IMAGE) || '' }}

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: index.docker.io/docspringcom/rack-gateway
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release_build:
    runs-on: ubuntu-latest
    needs: verify_tag
    permissions:
      contents: read
      checks: read # wait-for-checks.js reads check runs for the tagged commit
      id-token: write # sign the build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.verify_tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # cache: false so modules restored from another workflow's cache can't end up in the release binary
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9"
          cache: false

      - name: Build binary
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          go build \
            -tags nofido \
            -buildvcs=false \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" \
            -o rack-gateway-linux-amd64 \
            ./cmd/rack-gateway/
          ./rack-gateway-linux-amd64 version | grep -F "client: ${VERSION}"

      - name: Create archive and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          tar czf dist/rack-gateway-linux-amd64.tar.gz rack-gateway-linux-amd64
          (cd dist && sha256sum rack-gateway-linux-amd64.tar.gz > rack-gateway-linux-amd64.tar.gz.sha256)

      - name: Wait for CI and E2E checks on the tagged commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const script = require('./.github/wait-for-checks.js');
            await script({ github, context, core });

      - name: Attest binary build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: dist/rack-gateway-linux-amd64.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rack-gateway-linux-amd64
          path: dist/

  release_create:
    runs-on: ubuntu-latest
    needs:
      - verify_tag
      - docker_build
      - release_build
    permissions:
      contents: write # create the GitHub release
    env:
      RELEASE_TAG: ${{ needs.verify_tag.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify_tag.outputs.version }}
      REPOSITORY: ${{ github.repository }}
      IMAGE_DIGEST: ${{ needs.docker_build.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rack-gateway-linux-amd64
          path: dist

      - name: Verify checksum
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check --strict rack-gateway-linux-amd64.tar.gz.sha256

      - name: Generate changelog
        run: |
          set -euo pipefail
          {
            echo "## Installation"
            echo
            echo "### Linux (x86_64)"
            echo
            echo '```sh'
            echo "curl -fsSLO https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/rack-gateway-linux-amd64.tar.gz"
            echo "curl -fsSLO https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/rack-gateway-linux-amd64.tar.gz.sha256"
            echo "sha256sum --check rack-gateway-linux-amd64.tar.gz.sha256"
            echo "gh attestation verify rack-gateway-linux-amd64.tar.gz --repo ${REPOSITORY}"
            echo "tar xzf rack-gateway-linux-amd64.tar.gz"
            echo "sudo install -m 0755 rack-gateway-linux-amd64 /usr/local/bin/rack-gateway"
            echo "rack-gateway version"
            echo '```'
            echo
            echo "### Docker image"
            echo
            echo "\`docker.io/docspringcom/rack-gateway:${RELEASE_TAG}\` (digest \`${IMAGE_DIGEST}\`)"
            echo
            echo '```sh'
            echo "gh attestation verify oci://docker.io/docspringcom/rack-gateway:${RELEASE_TAG} --repo ${REPOSITORY}"
            echo '```'
          } > changelog.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/rack-gateway-linux-amd64.tar.gz
            dist/rack-gateway-linux-amd64.tar.gz.sha256
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: changelog.md
          name: rack-gateway v${{ env.RELEASE_VERSION }}
          draft: false
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
