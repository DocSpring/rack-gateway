name: Release

# Releases are built only from v* tags. A repository ruleset restricts creating,
# moving and deleting v* tags to repository admins.
on:
  push:
    tags:
      - v*

# Each job declares the minimum permissions it needs.
permissions: {}

jobs:
  # The image and the CLI are built while CI and E2E finish on the tagged commit. Each job waits for those
  # checks before it publishes anything (image push, attestations). Nothing public is tagged until every step has
  # passed: the image is pushed by digest only and the GitHub release is a draft, until the promote job tags the
  # image and publishes the release.
  verify_tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate tag and version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Error: invalid tag '$TAG' (expected vMAJOR.MINOR.PATCH[-PRERELEASE])" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(jq -r '.version' web/package.json)"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: tag $TAG does not match web/package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "short_sha=${COMMIT:0:7}"
          } >> "$GITHUB_OUTPUT"

  docker_build:
    runs-on: ubuntu-24.04
    needs: verify_tag
    permissions:
      contents: read
      checks: read # wait-for-checks.js reads check runs for the tagged commit
      id-token: write # sign the build provenance attestation
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: docker.io/docspringcom/rack-gateway
      VERSION: ${{ needs.verify_tag.outputs.version }}
      SHORT_SHA: ${{ needs.verify_tag.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No build cache: release images are built from scratch so a cache written by
      # another workflow run can't influence what gets published.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          no-cache: true
          load: true
          tags: rack-gateway-api:release-check
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      # The published binary must be a release build: the test bypasses (DEV_MODE, E2E_TEST_MODE, the endpoint
      # overrides) compiled out, not just switched off.
      - name: Check the image has no test bypasses
        run: |
          set -euo pipefail
          info="$(docker run --rm rack-gateway-api:release-check ./rack-gateway-api build-info)"
          echo "$info"
          grep -qx 'test bypasses: compiled out' <<<"$info"

      - name: Wait for CI and E2E checks on the tagged commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require('./.github/wait-for-checks.js');
            await script({ github, context, core });

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # The same build again, served from this job's builder, which only holds the from-scratch build above. It's
      # pushed by digest, without a tag: the promote job tags it once the release is complete.
      - name: Push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: index.docker.io/docspringcom/rack-gateway
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # One CLI archive per platform, each built and smoke-tested on its own runner. macOS builds link libfido2
  # statically and support security keys; Linux builds use the nofido tag (go-libfido2 links libfido2 dynamically
  # there). Intel Macs build from source. `rack-gateway update` and the install script download these archives, so
  # each one is published with its checksum and its build provenance attestation bundle.
  release_build:
    name: release_build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: verify_tag
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    permissions:
      contents: read
      checks: read # wait-for-checks.js reads check runs for the tagged commit
      id-token: write # sign the build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.verify_tag.outputs.version }}
      ASSET: rack-gateway-${{ matrix.platform }}.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cache: false so modules restored from another workflow's cache can't end up in the release binary
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      # The formulae come from the runner image's Homebrew snapshot (no auto-update).
      - name: Install libfido2
        if: startsWith(matrix.platform, 'darwin-')
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install libfido2 openssl@3

      - name: Build archive and checksum
        env:
          GOFLAGS: -mod=readonly
          REPOSITORY: ${{ github.repository }}
        run: ./scripts/build-cli-release.sh "$VERSION" "$REPOSITORY"

      - name: Check the archive is for this platform
        run: test -f "dist/${ASSET}"

      - name: Wait for CI and E2E checks on the tagged commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const script = require('./.github/wait-for-checks.js');
            await script({ github, context, core });

      - name: Attest binary build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.ASSET }}

      - name: Save the attestation bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/${ASSET}.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rack-gateway-${{ matrix.platform }}
          path: |
            dist/${{ env.ASSET }}
            dist/${{ env.ASSET }}.sha256
            dist/${{ env.ASSET }}.sigstore.json
          if-no-files-found: error

  release_create:
    runs-on: ubuntu-24.04
    needs:
      - verify_tag
      - docker_build
      - release_build
    permissions:
      contents: write # create the GitHub release
    env:
      RELEASE_TAG: ${{ needs.verify_tag.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify_tag.outputs.version }}
      REPOSITORY: ${{ github.repository }}
      IMAGE_DIGEST: ${{ needs.docker_build.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rack-gateway-*
          path: dist
          merge-multiple: true

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd dist
          for platform in linux-amd64 linux-arm64 darwin-arm64; do
            sha256sum --check --strict "rack-gateway-${platform}.tar.gz.sha256"
            test -s "rack-gateway-${platform}.tar.gz.sigstore.json"
          done

      # Published as the release's install.sh, so .../releases/latest/download/install.sh is the latest installer.
      - name: Add the install script
        run: cp scripts/install-release.sh dist/install.sh

      - name: Generate changelog
        run: |
          set -euo pipefail
          {
            echo "## Install the CLI"
            echo
            echo "macOS (Apple Silicon) and Linux (x86_64 and arm64):"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/install.sh | RACK_GATEWAY_VERSION=${RELEASE_TAG} sh"
            echo '```'
            echo
            echo "Already installed? Run \`rack-gateway update\`."
            echo
            echo "The macOS build supports security keys. The Linux builds don't: build the CLI from source for that."
            echo "Each archive has a SHA-256 checksum and a build provenance attestation (\`.sigstore.json\`), which"
            echo "the install script and \`rack-gateway update\` check. To check one by hand:"
            echo
            echo '```sh'
            echo "gh attestation verify rack-gateway-linux-amd64.tar.gz --repo ${REPOSITORY}"
            echo '```'
            echo
            echo "### Docker image"
            echo
            echo "\`docker.io/docspringcom/rack-gateway:${RELEASE_TAG}\` (digest \`${IMAGE_DIGEST}\`)"
            echo
            echo '```sh'
            echo "gh attestation verify oci://docker.io/docspringcom/rack-gateway:${RELEASE_TAG} --repo ${REPOSITORY}"
            echo '```'
          } > changelog.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/rack-gateway-*.tar.gz
            dist/rack-gateway-*.tar.gz.sha256
            dist/rack-gateway-*.tar.gz.sigstore.json
            dist/install.sh
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: changelog.md
          name: rack-gateway v${{ env.RELEASE_VERSION }}
          # Published by the promote job, once the image is tagged.
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true

  # Tags the attested image and publishes the draft release, once the image, the CLI, their attestations and the
  # draft release all exist. If this job fails, nothing is public yet (or only some tags are): re-run it.
  promote:
    runs-on: ubuntu-24.04
    needs:
      - verify_tag
      - docker_build
      - release_create
    # Releases are promoted one at a time. :latest moves only to the highest stable version, whatever order
    # releases finish in.
    concurrency:
      group: release-promote
      cancel-in-progress: false
    permissions:
      contents: write # publish the draft release
    env:
      IMAGE: docker.io/docspringcom/rack-gateway
      DIGEST: ${{ needs.docker_build.outputs.digest }}
      RELEASE_TAG: ${{ needs.verify_tag.outputs.tag }}
      SHORT_SHA: ${{ needs.verify_tag.outputs.short_sha }}
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Decide whether this release is the latest
        id: latest
        run: |
          set -euo pipefail
          # Prereleases (vX.Y.Z-rc.1) never move :latest.
          latest=false
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            highest="$(gh api --paginate "repos/${REPOSITORY}/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
            if [ "$highest" = "$RELEASE_TAG" ]; then
              latest=true
            fi
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # A carbon copy of the pushed index (--prefer-index=false), so every tag resolves to the attested digest.
      - name: Tag the image
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          set -euo pipefail
          tags=(--tag "${IMAGE}:${RELEASE_TAG}" --tag "${IMAGE}:${SHORT_SHA}")
          if [ "$LATEST" = "true" ]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "${IMAGE}@${DIGEST}"
          tagged="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" | awk '/^Digest:/ {print $2; exit}')"
          if [ "$tagged" != "$DIGEST" ]; then
            echo "Error: ${IMAGE}:${RELEASE_TAG} is ${tagged}, not the attested ${DIGEST}" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false --latest="$LATEST"
