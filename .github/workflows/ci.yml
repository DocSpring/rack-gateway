name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -count=1
      DATABASE_URL: postgres://postgres:postgres@localhost:55432/gateway_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/gateway_test?sslmode=disable
      GOLANGCI_LINT_VERSION: v2.11.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # setup-go's cache is shared with the lint job, which saves it first without any -race test builds, so
      # compiling the test binaries took most of this job. This job keeps its own build cache: main saves it,
      # and branches restore main's. Tests always run (GOFLAGS=-count=1): Go's test cache can't see the
      # Postgres server, so a cached pass could hide a Postgres change.
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9"
          cache: false

      - name: Restore Go test cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-tests-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-tests-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-tests-${{ runner.os }}-

      - name: Install libfido2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfido2-dev libudev-dev pkg-config

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Go deps
        run: task go:deps

      - name: Install Convox CLI
        uses: ./.github/actions/install-convox

      - name: Install Go tools
        run: task go:tools

      - name: Go tests
        run: task go:test

      - name: Save Go test cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-tests-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  lint:
    runs-on: ubuntu-latest
    env:
      GOLANGCI_LINT_VERSION: v2.11.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9"

      - name: Cache golangci-lint cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      - name: Install libfido2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfido2-dev libudev-dev pkg-config

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Go deps (lint warmup)
        run: task go:deps

      # The action installs the pinned golangci-lint release and verifies .golangci.yml
      # against its JSON schema (verify: true) before linting.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
        env:
          CGO_ENABLED: 1

      - name: Install jscpd for duplication checking
        # Pinned: an unpinned install pulled the jscpd v5 rewrite mid-flight and
        # broke CI (renamed flags, ignores .jscpd.json, different detection).
        # v4.0.5 matches scripts/check_duplication.sh and the .jscpd.json
        # configs; upgrading to v5 is a config+findings migration.
        run: npm install -g jscpd@4.0.5

      - name: Check code duplication
        run: task duplication

      - name: Check file length limits
        run: task file-length

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: task shellcheck

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check for vulnerabilities
        run: task go:sec:vuln

      - name: Install TruffleHog
        env:
          TRUFFLEHOG_VERSION: "3.97.9"
          TRUFFLEHOG_SHA256: 40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  ${tmp}/trufflehog.tar.gz" | sha256sum --check --strict
          tar -xzf "${tmp}/trufflehog.tar.gz" -C "${tmp}" trufflehog
          sudo install -m 0755 "${tmp}/trufflehog" /usr/local/bin/trufflehog
          rm -rf "${tmp}"
          trufflehog --version

      - name: Scan for secrets
        run: task go:sec:secrets

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The typecheck regenerates the OpenAPI spec and TypeScript types with Go tools.
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Install NPM packages
        working-directory: web
        run: |
          bun install --frozen-lockfile

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Web lint (Typecheck, Biome, and knip)
        run: task web:lint

      - name: Check for biome-ignore comments (zero tolerance)
        run: task web:check-ignores

      - name: Web tests
        run: task web:test

  mock-oauth-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Mock OAuth lint (Typecheck and Biome)
        run: task mock-oauth:lint

      - name: Mock OAuth tests
        run: task mock-oauth:test
