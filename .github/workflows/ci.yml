name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-tests:
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -count=1
      DATABASE_URL: postgres://postgres:postgres@localhost:55432/gateway_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55432/gateway_test?sslmode=disable
      GOLANGCI_LINT_VERSION: v2.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-go's cache is shared with the lint job, which saves it first without any -race test builds, so
      # compiling the test binaries took most of this job. This job keeps its own build cache: main saves it,
      # and branches restore main's. Tests always run (GOFLAGS=-count=1): Go's test cache can't see the
      # Postgres server, so a cached pass could hide a Postgres change.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Restore Go test cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-tests-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-tests-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-tests-${{ runner.os }}-

      - name: Install libfido2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfido2-dev libudev-dev pkg-config

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Go deps
        run: task go:deps

      - name: Install Convox CLI
        uses: ./.github/actions/install-convox

      - name: Install Go tools
        run: task go:tools

      - name: Go tests
        run: task go:test

      - name: Save Go test cache
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-tests-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}

  lint:
    runs-on: ubuntu-24.04
    env:
      GOLANGCI_LINT_VERSION: v2.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Cache golangci-lint cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('**/go.sum') }}

      - name: Install libfido2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfido2-dev libudev-dev pkg-config

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Go deps (lint warmup)
        run: task go:deps

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      # Verifies .golangci.yml against golangci-lint's JSON schema, which it downloads from golangci-lint.run. That
      # download sometimes times out, so it gets a few attempts (the action's own verify step makes one).
      - name: Verify golangci-lint config
        run: |
          for attempt in 1 2 3; do
            golangci-lint config verify && exit 0
            echo "golangci-lint config verify failed (attempt $attempt)"
            sleep 15
          done
          exit 1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          verify: false
        env:
          CGO_ENABLED: 1

      # The run above lints the release variant (no build tags). Only the testbypass package has files for builds
      # with the testbypass tag, so this lints just those.
      - name: golangci-lint (testbypass build)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          verify: false
          args: --build-tags testbypass ./internal/gateway/testbypass/...
        env:
          CGO_ENABLED: 1

      - name: Install jscpd for duplication checking
        # Pinned: an unpinned install pulled the jscpd v5 rewrite mid-flight and
        # broke CI (renamed flags, ignores .jscpd.json, different detection).
        # v4.0.5 matches scripts/check_duplication.sh and the .jscpd.json
        # configs; upgrading to v5 is a config+findings migration.
        run: npm install -g jscpd@4.0.5

      - name: Check code duplication
        run: task duplication

      - name: Check file length limits
        run: task file-length

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: task shellcheck

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check for vulnerabilities
        run: task go:sec:vuln

      - name: Install TruffleHog
        env:
          TRUFFLEHOG_VERSION: "3.97.9"
          TRUFFLEHOG_SHA256: 40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  ${tmp}/trufflehog.tar.gz" | sha256sum --check --strict
          tar -xzf "${tmp}/trufflehog.tar.gz" -C "${tmp}" trufflehog
          sudo install -m 0755 "${tmp}/trufflehog" /usr/local/bin/trufflehog
          rm -rf "${tmp}"
          trufflehog --version

      - name: Scan for secrets
        run: task go:sec:secrets

  web-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The typecheck regenerates the OpenAPI spec and TypeScript types with Go tools.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install NPM packages
        working-directory: web
        run: |
          bun install --frozen-lockfile

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Audit JavaScript dependencies (high and critical)
        run: task sec:js

      - name: Web lint (Typecheck, Biome, and knip)
        run: task web:lint

      - name: Check for biome-ignore comments (zero tolerance)
        run: task web:check-ignores

      - name: Web tests
        run: task web:test

  mock-oauth-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Mock OAuth lint (Typecheck and Biome)
        run: task mock-oauth:lint

      - name: Mock OAuth tests
        run: task mock-oauth:test
