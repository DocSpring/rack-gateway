name: Security Scan

# Daily scan so newly disclosed vulnerabilities show up even when nobody pushes.
# GitHub emails the workflow's last editor when a scheduled run fails.
on:
  schedule:
    - cron: "17 18 * * *" # daily, 06:17 NZST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install libfido2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfido2-dev libudev-dev pkg-config

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check Go vulnerabilities
        run: govulncheck ./...

  js-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Audit web, docs and mock OAuth dependencies (high and critical)
        run: scripts/check_js_audit.sh

  image-scan:
    runs-on: ubuntu-24.04
    steps:
      # The image is public, so the scan pulls it without Docker Hub credentials.
      - name: Scan the published gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: docker.io/docspringcom/rack-gateway:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
