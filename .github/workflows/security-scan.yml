name: Security Scan

# Daily scan so newly disclosed vulnerabilities show up even when nobody pushes.
# GitHub emails the workflow's last editor when a scheduled run fails.
on:
  schedule:
    - cron: "17 18 * * *" # daily, 06:17 NZST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.9"
          cache: false

      - name: Install libfido2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfido2-dev libudev-dev pkg-config

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Check Go vulnerabilities
        run: govulncheck ./...

  web-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.1"

      - name: Install web packages
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Audit web dependencies (high and critical)
        working-directory: web
        run: bun audit --audit-level=high

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan the published gateway image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: docker.io/docspringcom/rack-gateway:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
