name: E2E (Web + CLI, shared image)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The images are built once, in parallel, and both E2E jobs load them, so the stack starts without building
# anything (SKIP_BUILD). The tags match docker-compose.yml's test services.
#
# Only main writes the layer caches; branches read main's. PR caches used to fill the 10 GB Actions cache and
# evict main's layers, so every build started from scratch.
jobs:
  build-image:
    runs-on: ubuntu-24.04
    env:
      GATEWAY_IMAGE: rack-gateway-api:e2e-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The E2E stacks run with DEV_MODE and E2E_TEST_MODE, which only a testbypass build honours.
      - name: Build gateway image (with web UI and test bypasses) and export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.GATEWAY_IMAGE }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            GO_BUILD_TAGS=testbypass
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
          outputs: type=docker,dest=${{ runner.temp }}/images/gateway-api.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image-gateway
          path: ${{ runner.temp }}/images/gateway-api.tar
          retention-days: 1

  # The E2E jobs run a testbypass build in dev and E2E test mode, so they never exercise the release binary. This
  # builds the release image (no build tags, like the Release workflow) and smoke-tests it with a production
  # configuration: test bypasses compiled out and refused at startup, then a production boot with HSTS, a strict CSP,
  # no localhost origins, Secure cookies and OAuth against Google (see scripts/release-smoke.sh). It runs alongside
  # the E2E jobs, so it doesn't add to the workflow's run time.
  release-smoke:
    runs-on: ubuntu-24.04
    env:
      GATEWAY_RELEASE_IMAGE: rack-gateway-api:release-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Its own cache scope, so main's two gateway builds don't overwrite each other's cache. The web and Go module
      # layers match the E2E image's, so it reads that cache (the default scope) too.
      - name: Build release gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ env.GATEWAY_RELEASE_IMAGE }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: |
            type=gha,scope=gateway-release
            type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=gateway-release' || '' }}
          load: true

      # Prints the gateway's logs if a check fails.
      - name: Smoke-test the release image
        run: bash scripts/release-smoke.sh

      - name: Teardown
        if: always()
        run: docker compose --profile release down -v --remove-orphans

  build-mocks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build mock OAuth image and export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mock-oauth
          tags: rack-gateway-mock-oauth:test
          cache-from: type=gha,scope=mock-oauth
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=mock-oauth' || '' }}
          outputs: type=docker,dest=${{ runner.temp }}/images/mock-oauth.tar

      - name: Build mock Convox image and export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.mock-convox
          tags: rack-gateway-mock-convox:test
          cache-from: type=gha,scope=mock-convox
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=mock-convox' || '' }}
          outputs: type=docker,dest=${{ runner.temp }}/images/mock-convox.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-image-mocks
          path: ${{ runner.temp }}/images/*.tar
          retention-days: 1

  web-e2e:
    runs-on: ubuntu-24.04
    needs: [build-image, build-mocks]
    # Run (and fail at "Load images") when a build failed: a skipped job would pass as a required check.
    if: ${{ !cancelled() }}
    env:
      WEB_PORT: 9447
      GATEWAY_PORT: 9447
      MOCK_OAUTH_PORT: 9345
      MOCK_CONVOX_PORT: 6443
      GATEWAY_DEBUG_OAUTH: "false"
      CHECK_VITE_PROXY: "false"
      GATEWAY_TEST_IMAGE: rack-gateway-api:e2e-${{ github.sha }}
      SKIP_BUILD: "true"
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:55432/gateway_test?sslmode=disable
      # The published development key the test gateways use (docker-compose.yml): the DB helpers encrypt and
      # decrypt TOTP seeds with it.
      COLUMN_ENCRYPTION_KEY: cmFjay1nYXRld2F5LWRldi1vbmx5LWNvbHVtbi1rZXk=
      # Two gateways (each with its own database), one Playwright worker per gateway.
      WEB_E2E_SHARDS: 2
      PLAYWRIGHT_WORKERS: 2
      E2E_GATEWAY_PORTS: "9447,9448"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      # Compose would build any image that's missing, so check that all three were loaded.
      - name: Load images
        run: |
          for image in "${RUNNER_TEMP}"/images/*.tar; do docker load --input "$image"; done
          docker image inspect "$GATEWAY_TEST_IMAGE" rack-gateway-mock-oauth:test rack-gateway-mock-convox:test >/dev/null

      - name: Start stack (gateway serves UI)
        run: task docker:test:up

      - name: Wait for services
        run: |
          chmod +x scripts/wait-for-services.sh
          WEB_UI_PATH='/app/' WEB_PORT=${GATEWAY_PORT} CHECK_VITE_PROXY=false bash scripts/wait-for-services.sh

      - name: Diagnose endpoints
        run: |
          set -x
          docker compose ps
          curl -sv "http://127.0.0.1:${GATEWAY_PORT}/api/v1/health" || true
          curl -sv "http://127.0.0.1:${GATEWAY_PORT}/app/login" -o /dev/null || true

      - name: Install NPM packages
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install Playwright Chromium and system deps
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Run Web E2E
        working-directory: web
        run: bun run e2e

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose --profile test logs --no-color --timestamps

      - name: Teardown
        if: always()
        run: task docker:down

  cli-e2e:
    runs-on: ubuntu-24.04
    needs: [build-image, build-mocks]
    if: ${{ !cancelled() }}
    env:
      TEST_GATEWAY_PORT: 9447
      TEST_MOCK_OAUTH_PORT: 9345
      TEST_MOCK_CONVOX_PORT: 6443
      GATEWAY_TEST_IMAGE: rack-gateway-api:e2e-${{ github.sha }}
      SKIP_BUILD: "true"
      WEB_UI_PATH: "/app/"
      CHECK_VITE_PROXY: false
      CGO_ENABLED: 1
      # The published development key the test gateway uses (docker-compose.yml): totp-gen encrypts the
      # TOTP seeds the suite inserts with it.
      COLUMN_ENCRYPTION_KEY: cmFjay1nYXRld2F5LWRldi1vbmx5LWNvbHVtbi1rZXk=
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: ./.github/actions/install-task

      - name: Install libfido2 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfido2-dev libudev-dev pkg-config

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      # Compose would build any image that's missing, so check that all three were loaded.
      - name: Load images
        run: |
          for image in "${RUNNER_TEMP}"/images/*.tar; do docker load --input "$image"; done
          docker image inspect "$GATEWAY_TEST_IMAGE" rack-gateway-mock-oauth:test rack-gateway-mock-convox:test >/dev/null

      - name: Start stack (gateway serves UI)
        run: task docker:test:up

      - name: Wait for services
        run: |
          GATEWAY_PORT=9447 WEB_PORT=9447 MOCK_OAUTH_PORT=9345 CHECK_VITE_PROXY=false ./scripts/wait-for-services.sh

      - name: Install Convox CLI
        uses: ./.github/actions/install-convox

      - name: Run CLI E2E
        run: GATEWAY_PORT=9447 MOCK_OAUTH_PORT=9345 MOCK_CONVOX_PORT=6443 E2E_DATABASE_NAME=gateway_test E2E_GATEWAY_SERVICE=gateway-api-test ./scripts/cli-e2e.sh

      - name: Docker logs (on failure)
        if: failure()
        run: docker compose --profile test logs --no-color --timestamps

      - name: Teardown
        if: always()
        run: task docker:down
