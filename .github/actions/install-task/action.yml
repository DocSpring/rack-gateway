name: Install Task
description: Install a pinned, checksum-verified Task (taskfile.dev) binary into /usr/local/bin.

inputs:
  version:
    description: Task release version
    default: "3.54.0"
  sha256:
    description: SHA-256 of task_linux_amd64.tar.gz for that version (from task_checksums.txt)
    default: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb

runs:
  using: composite
  steps:
    - name: Install Task
      shell: bash
      env:
        TASK_VERSION: ${{ inputs.version }}
        TASK_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        curl -fsSL -o "${tmp}/task.tar.gz" \
          "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_amd64.tar.gz"
        echo "${TASK_SHA256}  ${tmp}/task.tar.gz" | sha256sum --check --strict
        tar -xzf "${tmp}/task.tar.gz" -C "${tmp}" task
        sudo install -m 0755 "${tmp}/task" /usr/local/bin/task
        rm -rf "${tmp}"
        task --version
