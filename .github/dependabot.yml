version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Replaced by the local modules in internal/shims (see go.mod replace directives)
      - dependency-name: github.com/docker/docker
      - dependency-name: github.com/moby/buildkit
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directories:
      - /web
      - /docs
      - /mock-oauth
    schedule:
      interval: weekly
    groups:
      bun-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /mock-oauth
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
