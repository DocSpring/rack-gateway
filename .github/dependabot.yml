version: 2

# Every ecosystem waits 7 days after a release before proposing it, so a compromised or broken release has time to be
# caught and pulled first. Security updates are not delayed. Manual upgrades follow the same rule (see AGENTS.md).
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Replaced by the local modules in internal/shims (see go.mod replace directives)
      - dependency-name: github.com/docker/docker
      - dependency-name: github.com/moby/buildkit
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directories:
      - /web
      - /docs
      - /mock-oauth
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /
      - /mock-oauth
      - /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
